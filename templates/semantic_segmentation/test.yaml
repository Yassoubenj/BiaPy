# BiaPy version: 3.5.13

SYSTEM:
    NUM_CPUS: -1

PROBLEM:
    TYPE: SEMANTIC_SEG
    NDIM: 3D
  
DATA: 
    PATCH_SIZE: (32, 128, 128, 3)
    # EXTRACT_RANDOM_PATCH : True
    # PROBABILITY_MAP : True
    # W_FOREGROUND : 0.94
    # W_BACKGROUND : 0.06
    TRAIN:
      PATH: /home/yasminebenjelloun/dataset/segmentation_data_moyen_10000/train/raw
      GT_PATH: /home/yasminebenjelloun/dataset/segmentation_data_moyen_10000/train/label
      IN_MEMORY: True
    VAL:
        SPLIT_TRAIN: 0.1
    TEST: 
        PATH: /home/yasminebenjelloun/dataset/segmentation_data_moyen_10000/test/raw
        GT_PATH: /home/yasminebenjelloun/dataset/segmentation_data_moyen_10000/test/label                                                                                                              
        IN_MEMORY: True
        LOAD_GT: True
        PADDING: (10,10,10)

AUGMENTOR:
    ENABLE: True
    RANDOM_ROT: True
    VFLIP: True
    HFLIP: True
    ZFLIP: True
    # CONTRAST: True
    # CONTRAST_FACTOR: (-0.3, 0.3)
    # BRIGHTNESS: True
    # BRIGHTNESS_FACTOR: (-0.3, 0.3)
    # GAMMA_CONTRAST: True
    # GC_GAMMA: (0.5, 1.5)
    # CHANNEL_SHUFFLE: True

MODEL:
    ARCHITECTURE: resunet
    FEATURE_MAPS: [16, 32, 64, 128, 256]
    LOAD_CHECKPOINT: False

TRAIN:
    ENABLE: True
    METRICS : ["iou", "cldice", "skeldist", "skeldice"]
    OPTIMIZER: ADAMW
    LR: 1.E-3
    BATCH_SIZE: 4
    EPOCHS: 200
    PATIENCE: 30
    LR_SCHEDULER:
        NAME: 'onecycle'    # use one-cycle learning rate scheduler
  
    # LR_SCHEDULER:
    #     #NAME: 'onecycle'
    #     NAME: 'warmupcosine'
    #     MIN_LR: 1.E-6
    #     WARMUP_COSINE_DECAY_EPOCHS: 50    # use one-cycle learning rate scheduler
  
TEST:
    ENABLE: True
    AUGMENTATION: False
    FULL_IMG: False
    METRICS : ["iou", "cldice", "skeldist", "skeldice"]
    
LOSS:
    TYPE: W_CE_DICE

