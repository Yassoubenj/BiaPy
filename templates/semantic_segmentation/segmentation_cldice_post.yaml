# BiaPy version: 3.5.13

SYSTEM:
    NUM_CPUS: -1

PROBLEM:
    TYPE: SEMANTIC_SEG
    NDIM: 3D

DATA:
    PATCH_SIZE: (32, 128, 128, 3)
    TRAIN:
        PATH: /home/yasminebenjelloun/dataset/segmentation_data_moyen_10000/train/raw
        GT_PATH: /home/yasminebenjelloun/dataset/segmentation_data_moyen_10000/train/label
        IN_MEMORY: True
        #PADDING: (4, 16, 16)
        _C.DATA.EXTRACT_RANDOM_PATCH = True
        _C.DATA.PROBABILITY_MAP = True
        _C.DATA.W_FOREGROUND = 0.94
        _C.DATA.W_BACKGROUND = 0.06

    VAL:
        #SPLIT_TRAIN: 0.2
        CROSS_VAL: True               
        #FROM_TRAIN: False  
        
    TEST:
        PATH: /home/yasminebenjelloun/dataset/segmentation_data_moyen_10000/test/raw
        GT_PATH: /home/yasminebenjelloun/dataset/segmentation_data_moyen_10000/test/label
        IN_MEMORY: True
        LOAD_GT: True
        #PADDING: (4,8,8)
        PADDING: (4, 16, 16)
    NORMALIZATION:
        TYPE: 'scale_range'
        #TYPE: "zero_mean_unit_variance"

# PATHS:
#   CHECKPOINT_FILE: /home/yasminebenjelloun/BiaPy/result/Segmentation_Dice_Batch10_data_10000/checkpoints/Segmentation_Dice_Batch10_data_10000_1-checkpoint-best.pth

AUGMENTOR:
    # DROPOUT: True
    # GRIDMASK: True
    # CUTOUT: True
    ENABLE: True
    # GRIDMASK: True
    #CUTBLUR: True
    RANDOM_ROT: True # quels axes à vérifier : x, y, z : 
    VFLIP: True
    HFLIP: True
    ZFLIP: True
    CONTRAST: True
    CONTRAST_FACTOR: (-0.3, 0.3)
    BRIGHTNESS: True
    BRIGHTNESS_FACTOR: (-0.3, 0.3)
    GAMMA_CONTRAST: True
    GC_GAMMA: (0.5, 1.5)
    CHANNEL_SHUFFLE: True
    #AFFINE_MODE: 'reflect'

MODEL:
  #LOAD_CHECKPOINT: True
  ARCHITECTURE: resunet++ 
  FEATURE_MAPS: [8, 16, 32]
  Z_DOWN: [1, 1] #il faut pas appliquer z_down car données anisotrope : donc on fixe à 1,1
  DROPOUT_VALUES: [0.2, 0.3, 0.4]

  LOAD_CHECKPOINT: False


# MODEL:
#     ARCHITECTURE: attention_unet
#     FEATURE_MAPS: [48, 64, 80, 96]
#     Z_DOWN: [1,1,1]
#     LOAD_CHECKPOINT: False

TRAIN:
    ENABLE: True
    METRICS : ["iou", "cldice"]
    OPTIMIZER: ADAMW
    LR: 1.E-4 
    BATCH_SIZE: 10
    EPOCHS: 300
    PATIENCE: 20 
    W_DECAY: 1e-4
    # LR_SCHEDULER:
    #     NAME: 'reduceonplateau'
    #     REDUCEONPLATEAU_FACTOR: 0.5
    #     REDUCEONPLATEAU_PATIENCE: 10
    #     MIN_LR: 1e-6 
    LR_SCHEDULER:
        NAME: 'warmupcosine'
        MIN_LR: 1.E-6
        WARMUP_COSINE_DECAY_EPOCHS: 15

# TEST:
#     ENABLE: True
#     FULL_IMG: False
  
TEST:
    ENABLE: True
    METRICS : ["iou", "cldice"]
    AUGMENTATION: False
    FULL_IMG: False

LOSS:
    # TYPE: W_CE_DICE
    # WEIGHTS: [0.5, 0.5]
    TYPE: DICE
    # ITER : 10
    # SMOOTH : 0.0000001
    # ALPHA: 0.0
