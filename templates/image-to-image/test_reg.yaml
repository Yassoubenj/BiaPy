# BiaPy version: 3.5.13

SYSTEM:
    NUM_CPUS: -1

PROBLEM:
    TYPE: IMAGE_TO_IMAGE
    NDIM: 3D

DATA:
    PATCH_SIZE: (32, 128, 128, 3)
    TRAIN:
        PATH: /home/yasminebenjelloun/dataset/regression_data_10000/train/raw
        GT_PATH: /home/yasminebenjelloun/dataset/regression_data_10000/train/label
        IN_MEMORY: True
    VAL:
        FROM_TRAIN: True
        SPLIT_TRAIN: 0.2
    TEST:
        PATH: /home/yasminebenjelloun/dataset/regression_data_10000/test/raw
        GT_PATH: /home/yasminebenjelloun/dataset/regression_data_10000/test/label
        IN_MEMORY: False
        LOAD_GT: True
        PADDING: (4,8,8)
    NORMALIZATION :
        TYPE : "scale_range"

AUGMENTOR:
    ENABLE: True
    RANDOM_ROT: True
    VFLIP: True
    HFLIP: True
    ZFLIP: True

MODEL:
    ARCHITECTURE: resunet
    FEATURE_MAPS: [16, 32, 64, 128, 256]
    LOAD_CHECKPOINT: False

TRAIN:
    ENABLE: True
    OPTIMIZER: ADAMW
    LR: 5.E-4
    BATCH_SIZE: 4
    EPOCHS: 200
    PATIENCE: 30
    LR_SCHEDULER:
        NAME: 'onecycle' 


TEST:
    ENABLE: True
    FULL_IMG: False

LOSS:
    TYPE: MSE